# Oracle and negative controls (acceptance tests A2-A3). No LLM involved.
results_dir: results/selftest
dataset_dir: third_party/verilog-eval/dataset_spec-to-rtl
subset_file: configs/problem_subset.txt
system_prompt_file: configs/system_prompt.txt
yosys_dir: configs/yosys

samples_per_problem: 2
seed_base: 1000
prompt_variants: [P0, P1]
sampling: {temperature: 0.85, top_p: 0.95, max_tokens: 1024}
t0_sampling: {temperature: 0.0, top_p: 0.01, max_tokens: 1024, seed: 0}

models:
  - {name: oracle, backend: oracle}
  - {name: empty_header, backend: empty_header}
  - {name: empty_module, backend: empty_module}
  - {name: prose, backend: prose}

workers: 1
sim_timeout_s: 30
yosys_timeout_s: 120
bootstrap: {n: 2000, seed: 12345}
