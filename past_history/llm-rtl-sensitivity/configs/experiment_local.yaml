# Full sensitivity experiment on this machine (Apple M1, no NVIDIA GPU).
# Identical design to experiment.yaml (60-problem subset, K=10, P0/P1, 2,640 generations),
# but pointed at two small local models that fit the disk budget here. The study measures
# HARNESS sensitivity (seed, prompt, extraction, naming, synthesis), which is model-agnostic;
# the absolute pass@1 levels are specific to these two small models and are reported as such.
results_dir: results/main
dataset_dir: third_party/verilog-eval/dataset_spec-to-rtl
subset_file: configs/problem_subset.txt
system_prompt_file: configs/system_prompt.txt
yosys_dir: configs/yosys

samples_per_problem: 10        # K
seed_base: 1000                # seed_k = seed_base + k
prompt_variants: [P0, P1]
sampling: {temperature: 0.85, top_p: 0.95, max_tokens: 1024}
t0_sampling: {temperature: 0.0, top_p: 0.01, max_tokens: 1024, seed: 0}

models:
  - {name: model_a, backend: openai_compat, base_url: "http://localhost:11434/v1", model: "qwen2.5-coder:1.5b"}
  - {name: model_b, backend: openai_compat, base_url: "http://localhost:11434/v1", model: "llama3.2:3b"}

workers: 1
sim_timeout_s: 30
yosys_timeout_s: 120
bootstrap: {n: 10000, seed: 12345}
