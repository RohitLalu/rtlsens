# Planted-truth validation: two stub "models" with known per-problem pass probabilities
# and known format quirks. Used to check that the pipeline recovers known quantities.
# These are NOT results about any real LLM.
results_dir: results/planted
dataset_dir: third_party/verilog-eval/dataset_spec-to-rtl
subset_file: configs/problem_subset.txt
system_prompt_file: configs/system_prompt.txt
yosys_dir: configs/yosys

samples_per_problem: 10
seed_base: 1000
prompt_variants: [P0, P1]
sampling: {temperature: 0.85, top_p: 0.95, max_tokens: 1024}
t0_sampling: {temperature: 0.0, top_p: 0.01, max_tokens: 1024, seed: 0}

models:
  - name: planted_a
    backend: planted
    planted: {scale: 1.0, p1_jitter: 0.3, t0_nondeterminism: 0.0,
              fmt: {tb_after: 0.10, tb_first: 0.05, nofence: 0.05, renamed: 0.08}}
  - name: planted_b
    backend: planted
    planted: {scale: 0.92, p1_jitter: 0.3, t0_nondeterminism: 0.15,
              fmt: {tb_after: 0.02, tb_first: 0.02, nofence: 0.20, renamed: 0.02}}

workers: 1
sim_timeout_s: 30
yosys_timeout_s: 120
bootstrap: {n: 10000, seed: 12345}
