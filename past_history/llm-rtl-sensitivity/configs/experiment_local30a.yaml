# Reduced sensitivity experiment on this machine (Apple M1, no NVIDIA GPU).
# Same design as experiment_local.yaml but on the first 30 of the 60-problem subset
# (K=10, P0/P1), to finish in reasonable time on CPU. 30 problems => wider confidence
# intervals; the paper notes the reduced subset. Reuses already-generated samples.
results_dir: results/main30a
dataset_dir: third_party/verilog-eval/dataset_spec-to-rtl
subset_file: configs/problem_subset_30.txt
system_prompt_file: configs/system_prompt.txt
yosys_dir: configs/yosys

samples_per_problem: 10        # K
seed_base: 1000
prompt_variants: [P0, P1]
sampling: {temperature: 0.85, top_p: 0.95, max_tokens: 1024}
t0_sampling: {temperature: 0.0, top_p: 0.01, max_tokens: 1024, seed: 0}

models:
  - {name: model_a, backend: openai_compat, base_url: "http://localhost:11434/v1", model: "qwen2.5-coder:1.5b"}

workers: 1
sim_timeout_s: 30
yosys_timeout_s: 120
bootstrap: {n: 10000, seed: 12345}
